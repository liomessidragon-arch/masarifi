<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>مصاريفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20261f;
    --paper:#F4F2EC;
    --paper-2:#FFFFFF;
    --line:#DAD5C6;
    --emerald:#1F6E52;
    --emerald-light:#E4F0EA;
    --brick:#A8452C;
    --brick-light:#F6E4DE;
    --gold:#B8860B;
    --muted:#7A7566;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Tajawal',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;}
  .hidden{display:none !important;}

  /* ---------- Setup screen ---------- */
  #setupScreen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:32px 24px;
    text-align:center;
    gap:18px;
  }
  #setupScreen .mark{
    font-size:40px;
    font-weight:900;
    color:var(--emerald);
    letter-spacing:-1px;
  }
  #setupScreen p{color:var(--muted);font-size:15px;line-height:1.7;max-width:340px;margin:0;}
  #setupScreen input{
    width:100%;
    max-width:340px;
    padding:14px 16px;
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    background:var(--paper-2);
    font-size:14px;
    font-family:inherit;
    direction:ltr;
    text-align:left;
  }
  .primary-btn{
    background:var(--emerald);
    color:#fff;
    border:none;
    padding:14px 28px;
    border-radius:var(--radius);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    width:100%;
    max-width:340px;
  }
  .primary-btn:active{opacity:.85;}
  .setup-error{color:var(--brick);font-size:13px;min-height:16px;}

  /* ---------- App shell ---------- */
  #app{max-width:520px;margin:0 auto;padding-bottom:100px;}
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 10px;
  }
  header.top h1{font-size:22px;font-weight:900;margin:0;}
  .icon-btn{
    background:none;border:none;font-size:20px;cursor:pointer;
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .icon-btn:active{background:var(--line);}

  /* summary cards */
  #summaryCards{
    display:flex;gap:10px;overflow-x:auto;padding:6px 20px 14px;
    scrollbar-width:none;
  }
  #summaryCards::-webkit-scrollbar{display:none;}
  .cur-card{
    flex:0 0 auto;
    min-width:190px;
    background:var(--paper-2);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .cur-card .cur-name{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .cur-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .cur-row .lbl{color:var(--muted);}
  .cur-row.income .val{color:var(--emerald);font-weight:700;}
  .cur-row.expense .val{color:var(--brick);font-weight:700;}
  .cur-row.net{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-weight:900;}

  /* toolbar */
  .toolbar{display:flex;gap:10px;padding:0 20px 14px;}
  .chip-btn{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--paper-2);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:10px 14px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    color:var(--ink);
  }
  .chip-btn.active{background:var(--emerald);color:#fff;border-color:var(--emerald);}
  #clearFiltersBtn{
    display:none;
    margin:0 20px 12px;
    background:none;border:none;color:var(--brick);font-size:13px;font-weight:700;
    text-decoration:underline;cursor:pointer;padding:0;
  }

  /* list */
  #transactionList{list-style:none;margin:0;padding:0 20px;display:flex;flex-direction:column;gap:8px;}
  .tx-item{
    background:var(--paper-2);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .tx-badge{
    width:8px;height:38px;border-radius:6px;flex:0 0 auto;
  }
  .tx-badge.income{background:var(--emerald);}
  .tx-badge.expense{background:var(--brick);}
  .tx-mid{flex:1;min-width:0;}
  .tx-cat{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-date{font-size:12px;color:var(--muted);margin-top:2px;}
  .tx-amount{font-size:15px;font-weight:900;white-space:nowrap;}
  .tx-amount.income{color:var(--emerald);}
  .tx-amount.expense{color:var(--brick);}
  .tx-del{
    background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;
    padding:4px 6px;flex:0 0 auto;
  }
  #emptyState{
    text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.8;
  }
  #emptyState .big{font-size:34px;margin-bottom:10px;}

  /* FAB */
  .fab{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    left:24px;
    width:58px;height:58px;
    border-radius:50%;
    background:var(--emerald);
    color:#fff;
    border:none;
    font-size:28px;
    box-shadow:0 6px 18px rgba(31,110,82,.4);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:20;
  }
  .fab:active{transform:scale(.94);}

  /* ---------- Modals ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(20,20,15,.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  .modal-sheet{
    background:var(--paper);
    width:100%;max-width:520px;
    border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
    max-height:88vh;
    overflow-y:auto;
  }
  .modal-sheet h2{font-size:18px;font-weight:900;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .field input, .field select{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper-2);
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
  }
  .seg{display:flex;gap:8px;}
  .seg button{
    flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--paper-2);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);
  }
  .seg button.sel-income.on{background:var(--emerald-light);border-color:var(--emerald);color:var(--emerald);}
  .seg button.sel-expense.on{background:var(--brick-light);border-color:var(--brick);color:var(--brick);}
  .modal-actions{display:flex;gap:10px;margin-top:8px;}
  .secondary-btn{
    flex:1;background:var(--paper-2);border:1.5px solid var(--line);border-radius:12px;
    padding:13px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);
  }
  .modal-actions .primary-btn{flex:2;max-width:none;}

  /* report */
  .report-card{
    background:var(--paper-2);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:10px;
  }
  .report-card .cur-name{font-weight:900;font-size:15px;margin-bottom:10px;}
  .bar-row{margin-bottom:10px;}
  .bar-row .bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .bar-track{height:8px;background:var(--paper);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-fill.income{background:var(--emerald);}
  .bar-fill.expense{background:var(--brick);}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;
    font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ============ Setup screen ============ -->
<div id="setupScreen">
  <div class="mark">مصاريفي</div>
  <p>وصّل التطبيق برابط الويب الخاص بسكربت جوجل شيت (Apps Script Web App URL) اللي نسخته بعد النشر.</p>
  <input id="apiUrlInput" type="text" placeholder="https://script.google.com/macros/s/xxxxx/exec">
  <div class="setup-error" id="setupError"></div>
  <button class="primary-btn" onclick="saveApiUrl()">حفظ والمتابعة</button>
</div>

<!-- ============ Main app ============ -->
<div id="app" class="hidden">
  <header class="top">
    <h1>مصاريفي</h1>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </header>

  <div id="summaryCards"></div>

  <div class="toolbar">
    <button class="chip-btn" id="filterChip" onclick="openFilterModal()">🔍 فلترة</button>
    <button class="chip-btn" onclick="openReportModal()">📊 التقارير</button>
  </div>
  <button id="clearFiltersBtn" onclick="clearFilters()">مسح الفلاتر</button>

  <ul id="transactionList"></ul>
  <div id="emptyState" class="hidden">
    <div class="big">📭</div>
    لا يوجد أي مصاريف أو دخل مسجّل بعد.<br>اضغط + لإضافة أول عملية.
  </div>

  <button class="fab" onclick="openAddModal()">+</button>
</div>

<!-- ============ Add modal ============ -->
<div class="modal-overlay hidden" id="addModalOverlay">
  <div class="modal-sheet">
    <h2>إضافة عملية</h2>
    <div class="field">
      <label>النوع</label>
      <div class="seg">
        <button type="button" class="sel-income" id="typeIncomeBtn" onclick="setTxType('دخل')">⬆️ دخل</button>
        <button type="button" class="sel-expense" id="typeExpenseBtn" onclick="setTxType('مصروف')">⬇️ مصروف</button>
      </div>
    </div>
    <div class="field">
      <label>التاريخ</label>
      <input type="date" id="txDate">
    </div>
    <div class="field">
      <label>الفئة / البيان</label>
      <input type="text" id="txCategory" list="categoryList" placeholder="مثال: بنزين، راتب، أكل...">
      <datalist id="categoryList"></datalist>
    </div>
    <div class="field">
      <label>المبلغ</label>
      <input type="number" id="txAmount" inputmode="decimal" placeholder="0.00">
    </div>
    <div class="field">
      <label>العملة</label>
      <select id="txCurrency">
        <option value="USD">دولار ($)</option>
        <option value="SYP">ليرة سورية (ل.س)</option>
        <option value="TRY">ليرة تركية (₺)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="secondary-btn" onclick="closeModal('addModalOverlay')">إلغاء</button>
      <button class="primary-btn" onclick="submitAdd()">حفظ</button>
    </div>
  </div>
</div>

<!-- ============ Filter modal ============ -->
<div class="modal-overlay hidden" id="filterModalOverlay">
  <div class="modal-sheet">
    <h2>فلترة العمليات</h2>
    <div class="field">
      <label>النوع</label>
      <select id="filterType">
        <option value="">الكل</option>
        <option value="دخل">دخل</option>
        <option value="مصروف">مصروف</option>
      </select>
    </div>
    <div class="field">
      <label>العملة</label>
      <select id="filterCurrency">
        <option value="">الكل</option>
        <option value="USD">دولار ($)</option>
        <option value="SYP">ليرة سورية (ل.س)</option>
        <option value="TRY">ليرة تركية (₺)</option>
      </select>
    </div>
    <div class="field">
      <label>الفئة</label>
      <select id="filterCategory">
        <option value="">الكل</option>
      </select>
    </div>
    <div class="field">
      <label>من تاريخ</label>
      <input type="date" id="filterFrom">
    </div>
    <div class="field">
      <label>إلى تاريخ</label>
      <input type="date" id="filterTo">
    </div>
    <div class="modal-actions">
      <button class="secondary-btn" onclick="closeModal('filterModalOverlay')">إلغاء</button>
      <button class="primary-btn" onclick="applyFilters()">تطبيق</button>
    </div>
  </div>
</div>

<!-- ============ Report modal ============ -->
<div class="modal-overlay hidden" id="reportModalOverlay">
  <div class="modal-sheet">
    <h2>التقرير الشهري</h2>
    <div class="field">
      <label>الشهر</label>
      <select id="reportMonth">
        <option value="">كل الشهور</option>
        <option value="01">يناير</option><option value="02">فبراير</option>
        <option value="03">مارس</option><option value="04">أبريل</option>
        <option value="05">مايو</option><option value="06">يونيو</option>
        <option value="07">يوليو</option><option value="08">أغسطس</option>
        <option value="09">سبتمبر</option><option value="10">أكتوبر</option>
        <option value="11">نوفمبر</option><option value="12">ديسمبر</option>
      </select>
    </div>
    <div class="field">
      <label>السنة</label>
      <input type="number" id="reportYear" placeholder="2026">
    </div>
    <button class="primary-btn" style="margin-bottom:16px;" onclick="generateReport()">عرض التقرير</button>
    <div id="reportResults"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= إعدادات وحالة عامة ================= */
const STORAGE_KEY = 'masarifi_api_url';
const CUR_LABEL = { USD: 'دولار ($)', SYP: 'ليرة سورية (ل.س)', TRY: 'ليرة تركية (₺)' };
const CUR_SYMBOL = { USD: '$', SYP: 'ل.س', TRY: '₺' };

let apiUrl = localStorage.getItem(STORAGE_KEY) || '';
let allTransactions = [];
let currentFilters = { type: '', currency: '', category: '', from: '', to: '' };
let selectedTxType = 'مصروف';

/* ================= الإقلاع ================= */
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('txDate').value = todayStr();
  if (apiUrl) {
    showApp();
    refreshData();
  }
});

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }

function showApp() {
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}

function saveApiUrl() {
  const val = document.getElementById('apiUrlInput').value.trim();
  const err = document.getElementById('setupError');
  if (!val.startsWith('https://script.google.com/')) {
    err.textContent = 'الرابط لازم يبدأ بـ https://script.google.com/ — تأكد إنك نسخت رابط الـ Web App الصحيح.';
    return;
  }
  err.textContent = '';
  apiUrl = val;
  localStorage.setItem(STORAGE_KEY, apiUrl);
  showApp();
  refreshData();
}

function openSettings() {
  document.getElementById('app').classList.add('hidden');
  document.getElementById('setupScreen').classList.remove('hidden');
  document.getElementById('apiUrlInput').value = apiUrl;
}

/* ================= الاتصال بالـ API ================= */
async function refreshData() {
  try {
    const res = await fetch(apiUrl + '?action=list');
    const data = await res.json();
    if (data.error) { showToast('خطأ: ' + data.error); return; }
    allTransactions = data.transactions || [];
    populateCategoryOptions();
    applyFiltersAndRender();
  } catch (e) {
    showToast('تعذّر الاتصال بالشيت. تأكد من الرابط والاتصال بالإنترنت.');
  }
}

async function submitAdd() {
  const category = document.getElementById('txCategory').value.trim();
  const amount = parseFloat(document.getElementById('txAmount').value);
  const currency = document.getElementById('txCurrency').value;
  const date = document.getElementById('txDate').value;

  if (!category) { showToast('اكتب الفئة أو البيان'); return; }
  if (!amount || amount <= 0) { showToast('اكتب مبلغ صحيح'); return; }

  const payload = { action: 'add', date, category, type: selectedTxType, amount, currency };
  try {
    await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    closeModal('addModalOverlay');
    showToast('تمت الإضافة ✅');
    document.getElementById('txCategory').value = '';
    document.getElementById('txAmount').value = '';
    refreshData();
  } catch (e) {
    showToast('تعذّرت الإضافة، حاول مرة ثانية');
  }
}

async function deleteTx(id) {
  if (!confirm('حذف هذه العملية؟')) return;
  try {
    await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', id })
    });
    showToast('تم الحذف');
    refreshData();
  } catch (e) {
    showToast('تعذّر الحذف');
  }
}

/* ================= إضافة عملية ================= */
function openAddModal() {
  document.getElementById('txDate').value = todayStr();
  setTxType('مصروف');
  document.getElementById('addModalOverlay').classList.remove('hidden');
}
function setTxType(type) {
  selectedTxType = type;
  document.getElementById('typeIncomeBtn').classList.toggle('on', type === 'دخل');
  document.getElementById('typeExpenseBtn').classList.toggle('on', type === 'مصروف');
}

/* ================= فلترة ================= */
function openFilterModal() {
  document.getElementById('filterType').value = currentFilters.type;
  document.getElementById('filterCurrency').value = currentFilters.currency;
  document.getElementById('filterCategory').value = currentFilters.category;
  document.getElementById('filterFrom').value = currentFilters.from;
  document.getElementById('filterTo').value = currentFilters.to;
  document.getElementById('filterModalOverlay').classList.remove('hidden');
}
function applyFilters() {
  currentFilters = {
    type: document.getElementById('filterType').value,
    currency: document.getElementById('filterCurrency').value,
    category: document.getElementById('filterCategory').value,
    from: document.getElementById('filterFrom').value,
    to: document.getElementById('filterTo').value
  };
  closeModal('filterModalOverlay');
  applyFiltersAndRender();
}
function clearFilters() {
  currentFilters = { type: '', currency: '', category: '', from: '', to: '' };
  applyFiltersAndRender();
}
function populateCategoryOptions() {
  const cats = Array.from(new Set(allTransactions.map(t => t.category).filter(Boolean))).sort();
  const dl = document.getElementById('categoryList');
  dl.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
  const sel = document.getElementById('filterCategory');
  const currentVal = sel.value;
  sel.innerHTML = '<option value="">الكل</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  sel.value = currentVal;
}

/* ================= العرض ================= */
function applyFiltersAndRender() {
  let list = allTransactions.slice();
  if (currentFilters.type) list = list.filter(t => t.type === currentFilters.type);
  if (currentFilters.currency) list = list.filter(t => t.currency === currentFilters.currency);
  if (currentFilters.category) list = list.filter(t => t.category === currentFilters.category);
  if (currentFilters.from) list = list.filter(t => t.date >= currentFilters.from);
  if (currentFilters.to) list = list.filter(t => t.date <= currentFilters.to);

  const filterActive = Object.values(currentFilters).some(Boolean);
  document.getElementById('filterChip').classList.toggle('active', filterActive);
  document.getElementById('clearFiltersBtn').style.display = filterActive ? 'block' : 'none';

  renderSummary(list);
  renderList(list);
}

function renderSummary(list) {
  const byCur = {};
  list.forEach(t => {
    if (!byCur[t.currency]) byCur[t.currency] = { income: 0, expense: 0 };
    if (t.type === 'دخل') byCur[t.currency].income += t.amount;
    else byCur[t.currency].expense += t.amount;
  });
  const wrap = document.getElementById('summaryCards');
  const currencies = Object.keys(byCur);
  if (currencies.length === 0) {
    wrap.innerHTML = '';
    return;
  }
  wrap.innerHTML = currencies.map(cur => {
    const d = byCur[cur];
    const net = d.income - d.expense;
    const sym = CUR_SYMBOL[cur] || cur;
    return `<div class="cur-card">
      <div class="cur-name">${CUR_LABEL[cur] || cur}</div>
      <div class="cur-row income"><span class="lbl">الدخل</span><span class="val">${fmt(d.income)} ${sym}</span></div>
      <div class="cur-row expense"><span class="lbl">المصروف</span><span class="val">${fmt(d.expense)} ${sym}</span></div>
      <div class="cur-row net"><span class="lbl">الصافي</span><span class="val">${fmt(net)} ${sym}</span></div>
    </div>`;
  }).join('');
}

function renderList(list) {
  const ul = document.getElementById('transactionList');
  const empty = document.getElementById('emptyState');
  if (list.length === 0) {
    ul.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  ul.innerHTML = list.map(t => {
    const isIncome = t.type === 'دخل';
    const sym = CUR_SYMBOL[t.currency] || t.currency;
    return `<li class="tx-item">
      <div class="tx-badge ${isIncome ? 'income' : 'expense'}"></div>
      <div class="tx-mid">
        <div class="tx-cat">${escapeHtml(t.category)}</div>
        <div class="tx-date">${t.date}</div>
      </div>
      <div class="tx-amount ${isIncome ? 'income' : 'expense'}">${isIncome ? '+' : '-'}${fmt(t.amount)} ${sym}</div>
      <button class="tx-del" onclick="deleteTx('${t.id}')">✕</button>
    </li>`;
  }).join('');
}

/* ================= التقارير ================= */
function openReportModal() {
  const now = new Date();
  document.getElementById('reportYear').value = now.getFullYear();
  document.getElementById('reportMonth').value = pad(now.getMonth() + 1);
  document.getElementById('reportResults').innerHTML = '';
  document.getElementById('reportModalOverlay').classList.remove('hidden');
}
function generateReport() {
  const month = document.getElementById('reportMonth').value;
  const year = document.getElementById('reportYear').value.trim();

  let list = allTransactions.slice();
  if (year) list = list.filter(t => t.date.slice(0, 4) === year);
  if (month) list = list.filter(t => t.date.slice(5, 7) === month);

  const byCur = {};
  list.forEach(t => {
    if (!byCur[t.currency]) byCur[t.currency] = { income: 0, expense: 0 };
    if (t.type === 'دخل') byCur[t.currency].income += t.amount;
    else byCur[t.currency].expense += t.amount;
  });

  const box = document.getElementById('reportResults');
  const currencies = Object.keys(byCur);
  if (currencies.length === 0) {
    box.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px 0;">لا توجد بيانات لهذه الفترة</div>';
    return;
  }
  box.innerHTML = currencies.map(cur => {
    const d = byCur[cur];
    const net = d.income - d.expense;
    const max = Math.max(d.income, d.expense, 1);
    const sym = CUR_SYMBOL[cur] || cur;
    return `<div class="report-card">
      <div class="cur-name">${CUR_LABEL[cur] || cur}</div>
      <div class="bar-row">
        <div class="bar-label"><span>الدخل</span><span>${fmt(d.income)} ${sym}</span></div>
        <div class="bar-track"><div class="bar-fill income" style="width:${(d.income/max*100)}%"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>المصروف</span><span>${fmt(d.expense)} ${sym}</span></div>
        <div class="bar-track"><div class="bar-fill expense" style="width:${(d.expense/max*100)}%"></div></div>
      </div>
      <div class="cur-row net" style="margin-top:2px;"><span class="lbl">الصافي</span><span class="val">${fmt(net)} ${sym}</span></div>
    </div>`;
  }).join('');
}

/* ================= أدوات مساعدة ================= */
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function fmt(n) { return (Math.round(n * 100) / 100).toLocaleString('en-US'); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* إغلاق المودال بالضغط على الخلفية */
document.querySelectorAll('.modal-overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.add('hidden'); });
});
</script>
