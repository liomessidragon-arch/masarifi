name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KS_PASS: ${{ secrets.KS_PASS }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASS: ${{ secrets.KEY_PASS }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Generate icons and splash
        run: npx capacitor-assets generate --android
      - name: Sync
        run: npx cap sync android
      - name: Notification permission
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          ./gradlew assembleRelease
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out app/build/outputs/apk/release/masarifi-release.apk "$RUNNER_TEMP/aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: masarifi-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/masarifi-release.apk
          if-no-files-found: error
