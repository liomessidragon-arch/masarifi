<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="masarifi-version" content="3.2-foundation">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>مصاريفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20261f;
    --paper:#F4F2EC;
    --paper-2:#FFFFFF;
    --line:#DAD5C6;
    --emerald:#1F6E52;
    --emerald-light:#E4F0EA;
    --brick:#A8452C;
    --brick-light:#F6E4DE;
    --gold:#B8860B;
    --gold-light:#FBF3DC;
    --muted:#7A7566;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Tajawal',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;}
  .hidden{display:none !important;}
  /* أثناء تهيئة Firebase لا نعرض شاشة الدخول قبل جاهزية Firebase */
  body:not(.firebase-ready) #setupScreen{visibility:hidden;}
  .firebase-boot-screen{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:9999;}
  .firebase-boot-screen .boot-mark{font-size:30px;font-weight:900;color:var(--emerald);}
  .firebase-boot-screen.hidden{display:none !important;}

  /* ---------- Setup screen ---------- */
  #setupScreen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
    text-align:center;
  }
  .auth-card{
    width:100%;
    max-width:380px;
    background:var(--paper-2);
    border:1.5px solid var(--line);
    border-radius:18px;
    padding:24px 20px;
    box-shadow:0 8px 28px rgba(32,38,31,.07);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .auth-card .mark{margin-bottom:2px;}
  .auth-card .auth-subtitle{margin:0 0 2px !important;font-size:14px !important;}
  .auth-card .primary-btn,
  .auth-card .secondary-btn{max-width:none;width:100%;}
  #setupScreen .mark{
    font-size:40px;
    font-weight:900;
    color:var(--emerald);
    letter-spacing:-1px;
  }
  #setupScreen p{color:var(--muted);font-size:15px;line-height:1.7;max-width:340px;margin:0;}
  #setupScreen input{
    width:100%;
    max-width:340px;
    padding:14px 16px;
    border-radius:var(--radius);
    border:1.5px solid var(--line);
    background:var(--paper-2);
    font-size:14px;
    font-family:inherit;
    direction:ltr;
    text-align:left;
  }
  .primary-btn{
    background:var(--emerald);
    color:#fff;
    border:none;
    padding:14px 28px;
    border-radius:var(--radius);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    width:100%;
    max-width:340px;
  }
  .primary-btn:active{opacity:.85;}
  .setup-error{color:var(--brick);font-size:13px;min-height:16px;}

  /* ---------- App shell ---------- */
  #app{max-width:520px;margin:0 auto;padding-bottom:100px;}
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 10px;
  }
  header.top h1{font-size:22px;font-weight:900;margin:0;}
  .icon-btn{
    background:none;border:none;font-size:20px;cursor:pointer;
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .icon-btn:active{background:var(--line);}

  .sync-status{font-size:10.5px;font-weight:700;padding:5px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;margin-inline-start:auto;margin-inline-end:6px;}
  .sync-status.online{background:var(--emerald-light);color:var(--emerald);border-color:var(--emerald);}
  .sync-status.offline{background:var(--brick-light);color:var(--brick);border-color:var(--brick);}
  .sync-status.syncing{background:var(--gold-light);color:var(--gold);border-color:var(--gold);}

  /* summary cards */
  #summaryCards{
    display:flex;gap:10px;overflow-x:auto;padding:6px 20px 14px;
    scrollbar-width:none;
  }
  #summaryCards::-webkit-scrollbar{display:none;}
  .cur-card{
    flex:0 0 auto;
    min-width:190px;
    background:var(--paper-2);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .cur-card .cur-name{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .cur-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .cur-row .lbl{color:var(--muted);}
  .cur-row.income .val{color:var(--emerald);font-weight:700;}
  .cur-row.expense .val{color:var(--brick);font-weight:700;}
  .cur-row.net{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-weight:900;}

  /* toolbar */
  .toolbar{display:flex;gap:10px;padding:0 20px 14px;}
  .chip-btn{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--paper-2);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:10px 14px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    color:var(--ink);
  }
  .chip-btn.active{background:var(--emerald);color:#fff;border-color:var(--emerald);}
  .dashboard-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px 14px;}
  .dash-card{background:var(--paper-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;}
  .dash-card .dash-icon{font-size:17px;}
  .dash-card .dash-label{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:700;}
  .dash-card .dash-value{display:block;font-size:14px;font-weight:900;margin-top:2px;}
  .search-wrap{padding:0 20px 10px;position:relative;}
  #searchInput{width:100%;padding:11px 40px 11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper-2);font:inherit;font-size:14px;color:var(--ink);outline:none;}
  #searchInput:focus{border-color:var(--emerald);}
  .search-icon{position:absolute;right:33px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
  .tx-edit{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 5px;flex:0 0 auto;}
  .tx-edit:active{color:var(--emerald);}
  #clearFiltersBtn{
    display:none;
    margin:0 20px 12px;
    background:none;border:none;color:var(--brick);font-size:13px;font-weight:700;
    text-decoration:underline;cursor:pointer;padding:0;
  }

  /* list */
  #transactionList{list-style:none;margin:0;padding:0 20px;display:flex;flex-direction:column;gap:8px;}
  .tx-item{
    background:var(--paper-2);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .tx-badge{
    width:8px;height:38px;border-radius:6px;flex:0 0 auto;
  }
  .tx-badge.income{background:var(--emerald);}
  .tx-badge.expense{background:var(--brick);}
  .tx-mid{flex:1;min-width:0;}
  .tx-cat{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-date{font-size:12px;color:var(--muted);margin-top:2px;}
  .tx-amount{font-size:15px;font-weight:900;white-space:nowrap;}
  .tx-amount.income{color:var(--emerald);}
  .tx-amount.expense{color:var(--brick);}
  .tx-del{
    background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;
    padding:4px 6px;flex:0 0 auto;
  }
  #emptyState{
    text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.8;
  }
  #emptyState .big{font-size:34px;margin-bottom:10px;}

  /* FAB */
  .fab{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    left:24px;
    width:58px;height:58px;
    border-radius:50%;
    background:var(--emerald);
    color:#fff;
    border:none;
    font-size:28px;
    box-shadow:0 6px 18px rgba(31,110,82,.4);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:20;
  }
  .fab:active{transform:scale(.94);}

  /* ---------- Modals ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(20,20,15,.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  #firebaseSettingsOverlay{z-index:50;}
  #categoryManagerOverlay{z-index:70;}
  #budgetModalOverlay{z-index:60;}
  .modal-sheet{
    background:var(--paper);
    width:100%;max-width:520px;
    border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
    max-height:88vh;
    overflow-y:auto;
  }
  .modal-card{
    background:var(--paper) !important;
    color:var(--ink);
    width:100%;max-width:520px;
    border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
    max-height:88vh;overflow-y:auto;
    box-shadow:0 -8px 30px rgba(0,0,0,.12);
  }
  .modal-sheet h2{font-size:18px;font-weight:900;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .field input, .field select{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper-2);
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
  }
  .seg{display:flex;gap:8px;}
  .seg button{
    flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--paper-2);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);
  }
  .seg button.sel-income.on{background:var(--emerald-light);border-color:var(--emerald);color:var(--emerald);}
  .seg button.sel-expense.on{background:var(--brick-light);border-color:var(--brick);color:var(--brick);}
  .modal-actions{display:flex;gap:10px;margin-top:8px;}
  .secondary-btn{
    flex:1;background:var(--paper-2);border:1.5px solid var(--line);border-radius:12px;
    padding:13px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);
  }
  .modal-actions .primary-btn{flex:2;max-width:none;}

  /* report */
  .report-card{
    background:var(--paper-2);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:10px;
  }
  .report-card .cur-name{font-weight:900;font-size:15px;margin-bottom:10px;}
  .bar-row{margin-bottom:10px;}
  .bar-row .bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .bar-track{height:8px;background:var(--paper);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-fill.income{background:var(--emerald);}
  .bar-fill.expense{background:var(--brick);}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;
    font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}

  /* seg مع 3 أزرار (دخل / مصروف / تحويل) */
  .seg.seg3 button{font-size:12.5px;padding:11px 4px;}
  .seg button.sel-transfer.on{background:#EDE7F6;border-color:#6A4CA0;color:#6A4CA0;}

  /* حقول التحويل */
  #transferFields{
    background:var(--paper-2);border:1.5px dashed var(--line);border-radius:12px;
    padding:12px;margin-bottom:14px;
  }
  #transferFields .field:last-child{margin-bottom:0;}

  /* دائرة توزيع الفئات */
  .chart-section{padding:0 20px 16px;}
  .chart-card{
    background:var(--paper-2);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;
  }
  .chart-card .chart-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;}
  .chart-wrap{position:relative;height:180px;display:flex;align-items:center;justify-content:center;}
  .donut-css{
    width:160px;height:160px;border-radius:50%;position:relative;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
  }
  .donut-css::after{
    content:"";position:absolute;inset:34px;border-radius:50%;
    background:var(--paper-2);z-index:1;
  }
  .donut-center{
    position:absolute;z-index:2;text-align:center;line-height:1.25;
    font-size:12px;font-weight:900;color:var(--ink);max-width:92px;
  }
  .donut-center small{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:2px;}

  .chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center;}
  .chart-legend .leg-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink);}
  .chart-legend .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}

  /* مقارنة بالشهر السابق */
  .compare-badge{
    display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;
    padding:2px 7px;border-radius:999px;margin-inline-start:6px;
  }
  .compare-badge.up-bad{background:var(--brick-light);color:var(--brick);}
  .compare-badge.up-good{background:var(--emerald-light);color:var(--emerald);}
  .compare-badge.down-good{background:var(--emerald-light);color:var(--emerald);}
  .compare-badge.down-bad{background:var(--brick-light);color:var(--brick);}

  /* بطاقة الإجمالي التقريبي */
  .total-approx-card{
    flex:0 0 auto;min-width:190px;
    background:linear-gradient(135deg,var(--gold-light,#FBF3DC),var(--paper-2));
    border:1.5px solid var(--gold);border-radius:var(--radius);padding:14px 16px;
  }
  .total-approx-card .cur-name{color:var(--gold);}
  .total-approx-card .big-val{font-size:20px;font-weight:900;margin-top:4px;}

  /* تكرار العملية (نصيحة بصرية بسيطة) */
  .tx-item{position:relative;}

  /* طباعة/تصدير PDF */
  @media print{
    body *{visibility:hidden;}
    #printArea{display:block !important;visibility:visible;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;right:0;left:0;padding:16px;}
  }
  #printArea{display:none;}

  /* ========== V2.2: categories, statements, budgets ========== */
  .tx-statement{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .budget-section{padding:0 20px 14px;}
  .budget-card{background:var(--paper-2);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .budget-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .budget-title{font-size:13px;font-weight:900;}
  .budget-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .mini-btn{border:1.5px solid var(--line);background:var(--paper-2);border-radius:10px;padding:7px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;}
  .budget-progress{height:10px;background:var(--paper);border-radius:999px;overflow:hidden;}
  .budget-progress-fill{height:100%;border-radius:999px;background:var(--emerald);transition:width .25s;}
  .budget-progress-fill.over{background:var(--brick);}
  .budget-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:7px;}
  .budget-cats{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
  .budget-cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;}
  .budget-cat-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .budget-cat-bar{height:6px;background:var(--paper);border-radius:999px;overflow:hidden;margin-top:4px;}
  .budget-cat-fill{height:100%;background:var(--gold);border-radius:999px;}
  .budget-cat-fill.over{background:var(--brick);}
  .budget-cat-amount{font-size:11px;color:var(--muted);white-space:nowrap;}
  .category-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .category-row{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;}
  .category-row .name{flex:1;font-size:13px;font-weight:700;}
  .category-row button{border:0;background:none;cursor:pointer;padding:5px;color:var(--muted);font-size:15px;}
  .category-add-row{display:flex;gap:8px;}
  .category-add-row input{flex:1;}


  .dashboard-strip{grid-template-columns:repeat(4,1fr);}
  @media(max-width:380px){.dashboard-strip{grid-template-columns:repeat(2,1fr);}}

.sync-status.error{background:var(--brick-light,#FBE9E6);color:var(--brick,#B94A3A);}
</style>
</head>
<body>
<div id="firebaseBootScreen" class="firebase-boot-screen"><div class="boot-mark">مصاريفي</div></div>

<!-- ============ Setup screen ============ -->
<div id="setupScreen"></div>

<!-- ============ Main app ============ -->
<div id="app" class="hidden">
  <header class="top">
    <h1>مصاريفي</h1>
    <div id="syncStatus" class="sync-status online" title="حالة المزامنة">☁️ متصل</div>
    <div style="display:flex;align-items:center;gap:4px;">
      <button class="icon-btn" id="firebaseUserMenuBtn" title="الحساب" onclick="openAccountMenu_()">👤</button>
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
  </header>

  <div id="balanceLabel" style="padding:0 20px 4px;font-size:12px;color:var(--muted);font-weight:700;"></div>
  <div id="summaryCards"></div>
  <div id="dashboardStrip" class="dashboard-strip"></div>
  <div class="budget-section" id="budgetSection"></div>
  <div class="search-wrap">
    <span class="search-icon">🔎</span>
    <input id="searchInput" type="search" placeholder="ابحث باسم الفئة أو البيان..." autocomplete="off">
  </div>

  <div class="chart-section" id="donutSection" style="display:none;">
    <div class="chart-card">
      <div class="chart-title">🍩 توزيع المصاريف حسب الفئة</div>
      <div class="chart-wrap"><div id="donutChart" class="donut-css" aria-label="مخطط توزيع المصاريف"></div></div>
      <div class="chart-legend" id="donutLegend"></div>
    </div>
  </div>

  <div class="toolbar">
    <button class="chip-btn" id="filterChip" onclick="openFilterModal()">🔍 فلترة</button>
    <button class="chip-btn" onclick="openBudgetModal()">💰 الميزانية</button>
    <button class="chip-btn" onclick="openReportModal()">📊 التقارير</button>
  </div>
  <button id="clearFiltersBtn" onclick="clearFilters()">مسح الفلاتر</button>

  <ul id="transactionList"></ul>
  <div id="emptyState" class="hidden">
    <div class="big">📭</div>
    لا يوجد أي مصاريف أو دخل مسجّل بعد.<br>اضغط + لإضافة أول عملية.
  </div>

  <button class="fab" onclick="openAddModal()">+</button>
</div>

<!-- ============ Add modal ============ -->
<div class="modal-overlay hidden" id="addModalOverlay">
  <div class="modal-sheet">
    <h2>إضافة عملية</h2>
    <div class="field">
      <label>النوع</label>
      <div class="seg seg3">
        <button type="button" class="sel-income" id="typeIncomeBtn" onclick="setTxType('دخل')">⬆️ دخل</button>
        <button type="button" class="sel-expense" id="typeExpenseBtn" onclick="setTxType('مصروف')">⬇️ مصروف</button>
        <button type="button" class="sel-transfer" id="typeTransferBtn" onclick="setTxType('تحويل')">💱 تحويل</button>
      </div>
    </div>
    <div class="field">
      <label>التاريخ</label>
      <input type="date" id="txDate">
    </div>
    <div class="field">
      <label>الفئة</label>
      <select id="txCategory" required></select>
    </div>
    <div class="field">
      <label>البيان</label>
      <input type="text" id="txStatement" placeholder="مثال: فروج مشوي، خضار وفواكه..." autocomplete="off">
    </div>
    <div class="field">
      <label id="txAmountLabel">المبلغ</label>
      <input type="number" id="txAmount" inputmode="decimal" placeholder="0.00">
    </div>
    <div class="field">
      <label id="txCurrencyLabel">العملة</label>
      <select id="txCurrency">
        <option value="USD">دولار ($)</option>
        <option value="SYP">ليرة سورية (ل.س)</option>
        <option value="TRY">ليرة تركية (₺)</option>
      </select>

<script>
/* ================= إعدادات وحالة عامة ================= */
const RATE_SYP_KEY = 'masarifi_syp_per_usd';
const RATE_TRY_KEY = 'masarifi_try_per_usd';
const CUR_LABEL = { USD: 'دولار ($)', SYP: 'ليرة سورية (ل.س)', TRY: 'ليرة تركية (₺)' };
const CUR_SYMBOL = { USD: '$', SYP: 'ل.س', TRY: '₺' };
const CAT_COLORS = ['#1F6E52','#A8452C','#B8860B','#6A4CA0','#2E6F8E','#8C7A3F','#C2694A','#4B8B6F','#9A6B9E','#5A7D9A'];

let rateSyp = parseFloat(localStorage.getItem(RATE_SYP_KEY)) || 0;
let rateTry = parseFloat(localStorage.getItem(RATE_TRY_KEY)) || 0;
let allTransactions = [];
let currentFilters = { type: '', currency: '', category: '', from: '', to: '' };
let selectedTxType = 'مصروف';
let donutChartInstance = null;
let reportChartInstance = null;
let lastReportData = null;
let editingTxId = null;
let chartLibPromise = null;
let syncInFlight = false;
let managedCategories = [];
let budgetData = [];
let budgetMonth = currentMonthPrefixSafe_();





function ensureChartJs() {
  if (window.Chart) return Promise.resolve();
  if (chartLibPromise) return chartLibPromise;
  chartLibPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js';
    script.async = true;
    script.onload = () => resolve();
    script.onerror = () => { chartLibPromise = null; reject(new Error('Chart.js load failed')); };
    document.head.appendChild(script);
  });
  return chartLibPromise;
}

function replaceTransactionId(tempId, realId) {
  const t = allTransactions.find(x => String(x.id) === String(tempId));
  if (t) t.id = realId;
  saveFirebaseCache_();
  populateCategoryOptions();
  applyFiltersAndRender();
}

function upsertLocalTransaction(tx) {
  const idx = allTransactions.findIndex(x => String(x.id) === String(tx.id));
  if (idx >= 0) allTransactions[idx] = tx;
  else allTransactions.unshift(tx);
  saveFirebaseCache_();
  populateCategoryOptions();
  applyFiltersAndRender();
}

function removeLocalTransaction(id) {
  allTransactions = allTransactions.filter(x => String(x.id) !== String(id));
  saveFirebaseCache_();
  populateCategoryOptions();
  applyFiltersAndRender();
}

function makeTempId() {
  return 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }







/* ================= الاتصال بالـ API ================= */
function openAddModal(prefill) {
  editingTxId = prefill && prefill.id ? prefill.id : null;
  document.querySelector('#addModalOverlay h2').textContent = editingTxId ? 'تعديل العملية' : 'إضافة عملية';
  document.getElementById('txDate').value = (prefill && prefill.date) || todayStr();

  if (prefill) {
    setTxType(prefill.type || 'مصروف');
    document.getElementById('txCategory').value = prefill.category || '';
    document.getElementById('txStatement').value = prefill.statement || '';
    document.getElementById('txAmount').value = prefill.amount || '';
    document.getElementById('txCurrency').value = prefill.currency || 'USD';
    document.getElementById('txToCurrency').value = prefill.toCurrency || 'SYP';
    document.getElementById('txToAmount').value = prefill.toAmount || '';
  } else {
    setTxType('مصروف');
    document.getElementById('txCategory').value = '';
    document.getElementById('txAmount').value = '';
    document.getElementById('txToCurrency').value = 'SYP';
    document.getElementById('txToAmount').value = '';
  }
  showModal_('addModalOverlay');
}

function setTxType(type) {
  selectedTxType = type;
  document.getElementById('typeIncomeBtn').classList.toggle('on', type === 'دخل');
  document.getElementById('typeExpenseBtn').classList.toggle('on', type === 'مصروف');
  document.getElementById('typeTransferBtn').classList.toggle('on', type === 'تحويل');
  const isTransfer = type === 'تحويل';
  document.getElementById('transferFields').classList.toggle('hidden', !isTransfer);
  document.getElementById('txAmountLabel').textContent = isTransfer ? 'المبلغ اللي حوّلته' : 'المبلغ';
  document.getElementById('txCurrencyLabel').textContent = isTransfer ? 'من عملة' : 'العملة';
}

/* ================= فلترة ================= */
function openFilterModal() {
  document.getElementById('filterType').value = currentFilters.type;
  document.getElementById('filterCurrency').value = currentFilters.currency;
  document.getElementById('filterCategory').value = currentFilters.category;
  document.getElementById('filterFrom').value = currentFilters.from;
  document.getElementById('filterTo').value = currentFilters.to;
  showModal_('filterModalOverlay');
}
function applyFilters() {
  currentFilters = {
    type: document.getElementById('filterType').value,
    currency: document.getElementById('filterCurrency').value,
    category: document.getElementById('filterCategory').value,
    from: document.getElementById('filterFrom').value,
    to: document.getElementById('filterTo').value
  };
  closeModal('filterModalOverlay');
  applyFiltersAndRender();
}
function clearFilters() {
  currentFilters = { type: '', currency: '', category: '', from: '', to: '' };
  applyFiltersAndRender();
}

/* ================= العرض ================= */
function currentMonthPrefix() {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1);
}
function currentMonthTransactions() {
  const prefix = currentMonthPrefix();
  return allTransactions.filter(t => t.date && t.date.slice(0, 7) === prefix);
}

function applyFiltersAndRender() {
  let list = allTransactions.slice();
  if (currentFilters.type) list = list.filter(t => t.type === currentFilters.type);
  if (currentFilters.currency) list = list.filter(t => t.currency === currentFilters.currency || (t.type === 'تحويل' && t.toCurrency === currentFilters.currency));
  if (currentFilters.category) list = list.filter(t => t.category === currentFilters.category);
  if (currentFilters.from) list = list.filter(t => t.date >= currentFilters.from);
  if (currentFilters.to) list = list.filter(t => t.date <= currentFilters.to);
  const search = document.getElementById('searchInput').value.trim().toLocaleLowerCase('ar');
  if (search) {
    list = list.filter(t => [t.category, t.statement, t.type, t.currency, t.toCurrency].filter(Boolean).some(v => String(v).toLocaleLowerCase('ar').includes(search)));
  }

  const filterActive = Object.values(currentFilters).some(Boolean);
  document.getElementById('filterChip').classList.toggle('active', filterActive);
  document.getElementById('clearFiltersBtn').style.display = filterActive ? 'block' : 'none';

  // الرصيد دايمًا بيعكس الشهر الحالي بس، بغض النظر عن فلترة القائمة تحته
  const nowD = new Date();
  document.getElementById('balanceLabel').textContent = '💼 رصيد ' + ARABIC_MONTHS_SHORT[nowD.getMonth()] + ' ' + nowD.getFullYear();
  const monthList = currentMonthTransactions();
  renderSummary(monthList);
  renderDashboard(monthList);
  renderList(list);
  renderDonutChart(list);
}

function renderDashboard(list) {
  const income = list.filter(t => t.type === 'دخل').length;
  const expense = list.filter(t => t.type === 'مصروف').length;
  const transfer = list.filter(t => t.type === 'تحويل').length;
  const latest = list.slice().sort((a,b) => String(b.date).localeCompare(String(a.date)))[0];
  const cats = new Set(list.map(t => t.category).filter(Boolean)).size;
  const strip = document.getElementById('dashboardStrip');
  strip.innerHTML = `
    <div class="dash-card"><span class="dash-icon">🧾</span><span class="dash-value">${list.length}</span><span class="dash-label">عملية هذا الشهر</span></div>
    <div class="dash-card"><span class="dash-icon">🏷️</span><span class="dash-value">${cats}</span><span class="dash-label">فئات مستخدمة</span></div>
    <div class="dash-card"><span class="dash-icon">📅</span><span class="dash-value">${latest ? formatDisplayDate(latest.date) : '—'}</span><span class="dash-label">آخر عملية</span></div>`;
}

function renderSummary(list) {
  const byCur = {};

  const ensureCur = (cur) => {
    if (!cur) return null;
    if (!byCur[cur]) {
      byCur[cur] = { income: 0, expense: 0, transferIn: 0, transferOut: 0 };
    }
    return byCur[cur];
  };

  list.forEach(t => {
    const amount = Number(t.amount) || 0;
    const cur = t.currency;
    if (!cur) return;

    if (t.type === 'دخل') {
      ensureCur(cur).income += amount;
      return;
    }

    if (t.type === 'مصروف') {
      ensureCur(cur).expense += amount;
      return;
    }

    if (t.type === 'تحويل') {
      // العملة المصدر: تنقص
      ensureCur(cur).transferOut += amount;

      // العملة المستلمة: تزيد
      const toCur = String(t.toCurrency || '').trim();
      const toAmount = Number(t.toAmount);
      if (toCur && Number.isFinite(toAmount) && toAmount > 0) {
        ensureCur(toCur).transferIn += toAmount;
      }
    }
  });

  const wrap = document.getElementById('summaryCards');
  const currencies = Object.keys(byCur);

  if (currencies.length === 0) {
    wrap.innerHTML = '';
    return;
  }

  const balanceOf = d => d.income - d.expense + d.transferIn - d.transferOut;

  let html = currencies.map(cur => {
    const d = byCur[cur];
    const balance = balanceOf(d);
    const sym = CUR_SYMBOL[cur] || cur;

    return `<div class="cur-card">
      <div class="cur-name">${CUR_LABEL[cur] || cur}</div>
      <div class="cur-row income"><span class="lbl">الدخل</span><span class="val">${fmt(d.income)} ${sym}</span></div>
      <div class="cur-row expense"><span class="lbl">المصروف</span><span class="val">${fmt(d.expense)} ${sym}</span></div>
      <div class="cur-row net"><span class="lbl">الرصيد</span><span class="val">${fmt(balance)} ${sym}</span></div>
    </div>`;
  }).join('');

  // الإجمالي التقريبي بالدولار يحسب الرصيد الفعلي لكل عملة،
  // بما فيه مبالغ التحويل الداخلة والخارجة.
  if (rateSyp > 0 || rateTry > 0) {
    const usd = byCur.USD || { income: 0, expense: 0, transferIn: 0, transferOut: 0 };
    const syp = byCur.SYP || { income: 0, expense: 0, transferIn: 0, transferOut: 0 };
    const try_ = byCur.TRY || { income: 0, expense: 0, transferIn: 0, transferOut: 0 };

    const totalBalance =
      balanceOf(usd) +
      (rateSyp > 0 ? balanceOf(syp) / rateSyp : 0) +
      (rateTry > 0 ? balanceOf(try_) / rateTry : 0);

    html = `<div class="total-approx-card">
      <div class="cur-name">🌐 الإجمالي التقريبي ($)</div>
      <div class="cur-row net"><span class="lbl">الرصيد</span><span class="big-val">${fmt(totalBalance)} $</span></div>
    </div>` + html;
  }

  wrap.innerHTML = html;
}

function renderDonutChart(list) {
  const section = document.getElementById('donutSection');
  const expenses = list.filter(t => t.type === 'مصروف');

  if (expenses.length === 0) {
    section.style.display = 'none';
    return;
  }

  let targetCur = currentFilters.currency;
  if (!targetCur) {
    const totals = {};
    expenses.forEach(t => {
      const amount = Number(t.amount) || 0;
      totals[t.currency] = (totals[t.currency] || 0) + amount;
    });
    targetCur = Object.keys(totals).sort((a, b) => totals[b] - totals[a])[0];
  }

  const filtered = expenses.filter(t => t.currency === targetCur);
  if (filtered.length === 0) {
    section.style.display = 'none';
    return;
  }

  const byCategory = {};
  filtered.forEach(t => {
    const category = t.category || 'بدون فئة';
    byCategory[category] = (byCategory[category] || 0) + (Number(t.amount) || 0);
  });

  const labels = Object.keys(byCategory).sort((a, b) => byCategory[b] - byCategory[a]);
  const values = labels.map(l => byCategory[l]);
  const colors = labels.map((_, i) => CAT_COLORS[i % CAT_COLORS.length]);
  const total = values.reduce((a, b) => a + b, 0);

  if (!total) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  section.querySelector('.chart-title').textContent =
    '🍩 توزيع المصاريف حسب الفئة (' + (CUR_LABEL[targetCur] || targetCur) + ')';

  // CSS donut: لا يعتمد على Canvas أو Chart.js، لذلك يعمل بثبات داخل APK/WebView.
  let cursor = 0;
  const stops = values.map((value, i) => {
    const startPct = (cursor / total) * 100;
    cursor += value;
    const endPct = (cursor / total) * 100;
    return `${colors[i]} ${startPct}% ${endPct}%`;
  }).join(', ');

  const chart = document.getElementById('donutChart');
  chart.style.background = `conic-gradient(${stops})`;
  chart.innerHTML = `
    <div class="donut-center">
      ${fmt(total)}
      <small>${CUR_SYMBOL[targetCur] || targetCur}</small>
    </div>`;

  const legend = document.getElementById('donutLegend');
  legend.innerHTML = labels.map((l, i) => {
    const pct = total > 0 ? Math.round(values[i] / total * 100) : 0;
    return `<div class="leg-item"><span class="dot" style="background:${colors[i]}"></span>${escapeHtml(l)} ${pct}%</div>`;
  }).join('');
}
const ARABIC_MONTHS_SHORT = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function formatDisplayDate(dateStr) {
  if (!dateStr || dateStr.length < 10) return dateStr || '';
  const parts = dateStr.substring(0, 10).split('-');
  if (parts.length !== 3) return dateStr;
  const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
  if (!m || m < 1 || m > 12) return dateStr;
  const now = new Date();
  const suffix = (y !== now.getFullYear()) ? ' ' + y : '';
  return d + ' ' + ARABIC_MONTHS_SHORT[m - 1] + suffix;
}

let txDataById = {};
function renderList(list) {
  const ul = document.getElementById('transactionList');
  const empty = document.getElementById('emptyState');
  txDataById = {};
  list.forEach(t => { txDataById[t.id] = t; });
  if (list.length === 0) {
    ul.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  ul.innerHTML = list.map(t => {
    let cls, amountText, badgeCls;
    if (t.type === 'تحويل') {
      cls = 'transfer';
      badgeCls = '';
      const toSym = CUR_SYMBOL[t.toCurrency] || t.toCurrency || '';
      amountText = '💱 ' + fmt(t.amount) + ' ' + (CUR_SYMBOL[t.currency] || t.currency) +
        (t.toCurrency ? ' ← ' + (Number(t.toAmount) > 0 ? fmt(t.toAmount) + ' ' : '') + toSym : '');
    } else {
      const isIncome = t.type === 'دخل';
      cls = isIncome ? 'income' : 'expense';
      badgeCls = cls;
      const sym = CUR_SYMBOL[t.currency] || t.currency;
      amountText = (isIncome ? '+' : '-') + fmt(t.amount) + ' ' + sym;
    }
    return `<li class="tx-item" data-id="${t.id}">
      <div class="tx-badge ${badgeCls}" ${t.type === 'تحويل' ? 'style="background:#6A4CA0"' : ''}></div>
      <div class="tx-mid">
        <div class="tx-cat">${escapeHtml(t.category)}</div>
        ${t.statement ? `<div class="tx-statement">${escapeHtml(t.statement)}</div>` : ''}
        <div class="tx-date">${formatDisplayDate(t.date)}</div>
      </div>
      <div class="tx-amount ${cls}">${amountText}</div>
      <button class="tx-edit" title="تعديل" onclick="event.stopPropagation(); openAddModal(txDataById['${t.id}'])">✎</button>
      <button class="tx-del" onclick="event.stopPropagation(); deleteTx('${t.id}')">✕</button>
    </li>`;
  }).join('');
  document.querySelectorAll('.tx-item').forEach(item => {
    item.addEventListener('click', (e) => {
      if (e.target.closest('.tx-del') || e.target.closest('.tx-edit')) return;
      openAddModal(txDataById[item.dataset.id]);
    });
  });
  attachLongPress();
}

/* ================= تكرار عملية (ضغط مطوّل) ================= */
function attachLongPress() {
  const items = document.querySelectorAll('.tx-item');
  items.forEach(item => {
    let timer = null;
    const start = () => { timer = setTimeout(() => { onLongPress(item.dataset.id); }, 550); };
    const cancel = () => { if (timer) clearTimeout(timer); };
    item.addEventListener('touchstart', start, { passive: true });
    item.addEventListener('touchend', cancel);
    item.addEventListener('touchmove', cancel);
    item.addEventListener('mousedown', start);
    item.addEventListener('mouseup', cancel);
    item.addEventListener('mouseleave', cancel);
  });
}
function onLongPress(id) {
  const t = txDataById[id];
  if (!t || t.type === 'تحويل') return;
  if (navigator.vibrate) navigator.vibrate(30);

function currencyTotalsFor(list) {
  const out = {};

  const ensure = (cur) => {
    if (!cur) return null;
    if (!out[cur]) out[cur] = { income: 0, expense: 0, transferIn: 0, transferOut: 0 };
    return out[cur];
  };

  list.forEach(t => {
    const amount = Number(t.amount) || 0;
    if (!t.currency) return;

    if (t.type === 'دخل') {
      ensure(t.currency).income += amount;
    } else if (t.type === 'مصروف') {
      ensure(t.currency).expense += amount;
    } else if (t.type === 'تحويل') {
      ensure(t.currency).transferOut += amount;

      const toCur = String(t.toCurrency || '').trim();
      const toAmount = Number(t.toAmount);
      if (toCur && Number.isFinite(toAmount) && toAmount > 0) {
        ensure(toCur).transferIn += toAmount;
      }
    }
  });

  return out;
}

function pctChange(curr, prev) {
  if (prev === 0) return curr === 0 ? null : 100;
  return ((curr - prev) / Math.abs(prev)) * 100;
}
function compareBadge(curr, prev, goodWhenUp) {
  const change = pctChange(curr, prev);
  if (change === null) return '';
  const up = change >= 0;
  const good = up ? goodWhenUp : !goodWhenUp;
  const cls = good ? (up ? 'up-good' : 'down-good') : (up ? 'up-bad' : 'down-bad');
  const arrow = up ? '▲' : '▼';
  return `<span class="compare-badge ${cls}">${arrow} ${Math.abs(Math.round(change))}%</span>`;
}

  }

  box.innerHTML = currencies.map(cur => {

        <div class="bar-track"><div class="bar-fill income" style="width:${(d.income/max*100)}%"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>المصروف ${hasPrev ? compareBadge(d.expense, p.expense, false) : ''}</span><span>${fmt(d.expense)} ${sym}</span></div>
        <div class="bar-track"><div class="bar-fill expense" style="width:${(d.expense/max*100)}%"></div></div>
      </div>
      <div class="cur-row net" style="margin-top:2px;"><span class="lbl">الصافي ${hasPrev ? compareBadge(net, (p.income - p.expense + p.transferIn - p.transferOut), true) : ''}</span><span class="val">${fmt(net)} ${sym}</span></div>
    </div>`;
  }).join('');

  // زر PDF لا يعتمد على نجاح تحميل Chart.js.
  lastReportData = { periodLabel, byCur, prevByCur, hasPrev: !!(month && year) };
  exportBtn.classList.remove('hidden');

  // Chart.js يُحمّل عند طلب التقرير فقط، وليس عند فتح التطبيق.
  try {
    await ensureChartJs();
  } catch (e) {
    chartWrap.style.display = 'none';
    return;
  }

  // رسم بياني (أعمدة دخل/مصروف لكل عملة)
  chartWrap.style.display = 'block';
  const ctx = document.getElementById('reportChart').getContext('2d');
  if (reportChartInstance) reportChartInstance.destroy();
  reportChartInstance = new Chart(ctx, {
    type: 'bar',

      labels: currencies.map(c => CUR_LABEL[c] || c),
      datasets: [
        { label: 'الدخل', data: currencies.map(c => byCur[c].income), backgroundColor: '#1F6E52', borderRadius: 6 },
        { label: 'المصروف', data: currencies.map(c => byCur[c].expense), backgroundColor: '#A8452C', borderRadius: 6 }
      ]
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { family: 'Tajawal' } } } },
      scales: { y: { beginAtZero: true } }
    }
  });

}

async function exportReportPdf() {
  if (!lastReportData) { showToast('ولّد التقرير أولاً'); return; }
  if (typeof jspdf === 'undefined' || !jspdf.jsPDF) {
    showToast('مكتبة PDF لم تُحمّل، أعد المحاولة');
    return;
  }

  const { periodLabel, byCur } = lastReportData;
  const currencies = Object.keys(byCur);

  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;

    // ننشئ Canvas بشكل مباشر بدلاً من html2canvas/html2pdf.
    // هذا أكثر ثباتاً داخل WebView على أندرويد، وCanvas الأصلي يتعامل
    // مع تشكيل النص العربي واتجاه RTL من خلال محرك المتصفح نفسه.
    const W = 1240;
    const rowH = 92;
    const H = Math.max(1754, 430 + currencies.length * rowH);
    const canvas = document.createElement('canvas');
    canvas.width = W * 2;
    canvas.height = H * 2;
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.direction = 'rtl';
    ctx.textBaseline = 'middle';

    const fontFamily = 'Tajawal, Arial, sans-serif';
    const right = W - 70;

    // العنوان
    ctx.fillStyle = '#20261f';
    ctx.font = '700 34px ' + fontFamily;
    ctx.textAlign = 'right';
    ctx.fillText('تقرير مصاريفي', right, 72);

    ctx.fillStyle = '#666666';
    ctx.font = '500 22px ' + fontFamily;
    ctx.fillText(String(periodLabel), right, 125);

    // عنوان الجدول
    const tableX = 70, tableY = 190, tableW = W - 140;
    const cols = [tableX, tableX + tableW*0.25, tableX + tableW*0.50, tableX + tableW*0.75, tableX + tableW];
    const headerH = 70;

    ctx.fillStyle = '#1F6E52';
    ctx.fillRect(tableX, tableY, tableW, headerH);
    ctx.strokeStyle = '#cccccc';
    ctx.lineWidth = 2;
    ctx.strokeRect(tableX, tableY, tableW, headerH);

    const headers = ['العملة', 'الدخل', 'المصروف', 'الصافي'];
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 20px ' + fontFamily;
    ctx.textAlign = 'center';
    for (let i = 0; i < 4; i++) {
      const cx = (cols[i+1] + cols[i+0]) / 2;
      ctx.fillText(headers[i], cx, tableY + headerH/2);
    }

    currencies.forEach((cur, idx) => {
      const d = byCur[cur];
      const net = d.income - d.expense + d.transferIn - d.transferOut;
      const sym = CUR_SYMBOL[cur] || cur;
      const y = tableY + headerH + idx * rowH;

      ctx.fillStyle = idx % 2 === 0 ? '#ffffff' : '#f7f7f7';
      ctx.fillRect(tableX, y, tableW, rowH);
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(tableX, y, tableW, rowH);

      ctx.fillStyle = '#20261f';
      ctx.font = '600 20px ' + fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText(String(CUR_LABEL[cur] || cur), (cols[0]+cols[1])/2, y+rowH/2);

      ctx.font = '500 19px ' + fontFamily;
      ctx.fillText(fmt(d.income) + ' ' + sym, (cols[1]+cols[2])/2, y+rowH/2);
      ctx.fillText(fmt(d.expense) + ' ' + sym, (cols[2]+cols[3])/2, y+rowH/2);
      ctx.fillText(fmt(net) + ' ' + sym, (cols[3]+cols[4])/2, y+rowH/2);
    });

    const footerY = tableY + headerH + currencies.length * rowH + 65;
    ctx.strokeStyle = '#dddddd';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tableX, footerY - 28);
    ctx.lineTo(tableX + tableW, footerY - 28);
    ctx.stroke();
    ctx.fillStyle = '#777777';
    ctx.font = '400 16px ' + fontFamily;
    ctx.textAlign = 'right';
    ctx.fillText('تم إنشاء هذا التقرير من تطبيق مصاريفي بتاريخ ' + todayStr(), right, footerY);

    const img = canvas.toDataURL('image/jpeg', 0.95);
    const pdf = new jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    const pageW = 210, pageH = 297;
    const ratio = Math.min(pageW / W, pageH / H);
    const imgW = W * ratio, imgH = H * ratio;
    const x = (pageW - imgW) / 2;
    const y = 0;
    pdf.addImage(img, 'JPEG', x, y, imgW, imgH, undefined, 'FAST');
    pdf.save('masarifi-report-' + todayStr() + '.pdf');
    showToast('تم إنشاء ملف PDF ✅');
  } catch (e) {
    console.error('PDF error', e);
    showToast('تعذر إنشاء ملف PDF');
  }
}

function loadFirebaseCategoryCache_(){
  try{
    const raw=localStorage.getItem(firebaseCatCacheKey_());
    if(!raw) return false;
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed)) return false;
    managedCategories=parsed.filter(c=>c && c.name && c.active!==false).map(c=>({
      id:String(c.id||''),
      name:String(c.name||''),
      aliases:Array.isArray(c.aliases)?c.aliases:[]
    }));
    managedCategories.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
    populateCategoryOptions();

  }catch(e){ return false; }

function findManagedCategoryByName_(name){
  const target=String(name||'').trim();
  if(!target) return null;
  return (managedCategories||[]).find(c=>c.name===target || (Array.isArray(c.aliases) && c.aliases.includes(target))) || null;
}
function normalizeCategory_(rawName, rawId){
  const byId = rawId ? (managedCategories||[]).find(c=>String(c.id)===String(rawId)) : null;
  const byName = findManagedCategoryByName_(rawName);
  const cat = byId || byName;
  return {
    id: cat ? cat.id : (rawId || ''),
    name: cat ? cat.name : (rawName || '')
  };
}

function normalizeFirebaseTx_(id,d){
  const x=d||{};
  const cat=normalizeCategory_(x.category,x.categoryId);
  return {
    id,
    date:x.date||todayStr(),
    category:cat.name||x.category||'مصاريف عامة',
    categoryId:cat.id||'',
    statement:x.statement||'',
    type:x.type||'مصروف',
    amount:Number(x.amount)||0,
    currency:x.currency||'USD',
    owner:firebaseUser ? firebaseUser.uid : '',
    toCurrency:x.toCurrency||'',
    toAmount:(x.toAmount===null||x.toAmount===undefined||x.toAmount==='')?null:Number(x.toAmount)||0,
    createdAt:x.createdAt || 0
  };
}

function transactionCreatedTime_(tx){
  const v=tx && tx.createdAt;
  if(v && typeof v.toMillis==='function') return v.toMillis();
  if(v && typeof v.seconds==='number') return v.seconds*1000;
  if(typeof v==='number') return v;
  const parsed=Date.parse(v);
  return Number.isFinite(parsed)?parsed:0;
}

function sortTransactionsNewestFirst_(rows){
  return rows.sort((a,b)=>{
    const dateCmp=String(b.date||'').localeCompare(String(a.date||''));
    if(dateCmp!==0) return dateCmp;
    return transactionCreatedTime_(b)-transactionCreatedTime_(a);
  });
}

/* Firebase replaces the old Apps Script data layer. V3.3 sync foundation. */
let txUnsubscribe_ = null;
let syncRetryTimer_ = null;
let syncQueue_ = [];
let syncQueueRunning_ = false;

function syncQueueKey_(){ return 'masarifi_sync_queue_' + (firebaseUser ? firebaseUser.uid : 'guest'); }
function loadSyncQueue_(){
  try{ const raw=localStorage.getItem(syncQueueKey_()); syncQueue_=raw?JSON.parse(raw):[]; if(!Array.isArray(syncQueue_))syncQueue_=[]; }
  catch(e){ syncQueue_=[]; }
}
function saveSyncQueue_(){ try{localStorage.setItem(syncQueueKey_(),JSON.stringify(syncQueue_));}catch(e){} }
function pendingTxIds_(){ return new Set(syncQueue_.map(q=>String(q.id)).filter(Boolean)); }
function setSyncStatus_(mode,msg){
  const el=document.getElementById('syncStatus'); if(!el)return;
  el.className='sync-status '+mode;
  if(mode==='offline') el.textContent='📴 غير متصل';
  else if(mode==='syncing') el.textContent='🔄 مزامنة...';
  else if(mode==='error') el.textContent='⚠️ فشل المزامنة';
  else el.textContent='☁️ '+(msg||'متصل');
}
function updateSyncStatusFromQueue_(){
  if(!navigator.onLine){ setSyncStatus_('offline'); return; }
  if(syncQueue_.length){ setSyncStatus_('syncing','مزامنة'); return; }
  setSyncStatus_('online','محفوظ');
}
function enqueueMutation_(op){
  // Keep the queue compact: edits on an unsynced add update that add instead of creating extra work.
  if(op.action==='set'){
    const add=syncQueue_.find(q=>q.action==='add' && String(q.id)===String(op.id));
    if(add){ add.payload={...add.payload,...op.payload}; add.at=Date.now(); saveSyncQueue_(); return; }
    const idx=syncQueue_.findIndex(q=>q.action==='set' && String(q.id)===String(op.id));
    if(idx>=0){syncQueue_[idx]={...syncQueue_[idx],payload:{...syncQueue_[idx].payload,...op.payload},at:Date.now()};saveSyncQueue_();return;}
  }
  if(op.action==='delete'){
    const addIdx=syncQueue_.findIndex(q=>q.action==='add' && String(q.id)===String(op.id));
    if(addIdx>=0){syncQueue_.splice(addIdx,1);saveSyncQueue_();return;}
    syncQueue_=syncQueue_.filter(q=>!(q.action==='set' && String(q.id)===String(op.id)));
  }
  syncQueue_.push({...op,at:Date.now()}); saveSyncQueue_();
}
function removeQueuedOp_(op){
  const i=syncQueue_.indexOf(op); if(i>=0){syncQueue_.splice(i,1);saveSyncQueue_();}
}
function applyPendingToRows_(rows){
  const map=new Map(rows.map(t=>[String(t.id),t]));
  for(const q of syncQueue_){
    const id=String(q.id);
    if(q.action==='delete'){map.delete(id);continue;}
    if(q.action==='add') map.set(id,normalizeFirebaseTx_(id,{...q.payload,createdAt:q.createdAt||Date.now()}));
    if(q.action==='set' && map.has(id)) map.set(id,{...map.get(id),...q.payload});
  }
  return sortTransactionsNewestFirst_(Array.from(map.values()));
}
function renderCurrentSync_(){
  allTransactions=applyPendingToRows_(allTransactions);
  saveFirebaseCache_(); populateCategoryOptions(); applyFiltersAndRender();
}

async function syncQueueNow_(){
  if(!firebaseUser || syncQueueRunning_ || !navigator.onLine || !syncQueue_.length)return;
  syncQueueRunning_=true; setSyncStatus_('syncing');
  try{
    const queue=syncQueue_.slice();
    for(const op of queue){
      if(!navigator.onLine)break;
      try{
        if(op.action==='add'){
          const ref=await txCol_().add({...op.payload,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
          // Keep the optimistic row and replace only its temporary ID.
          // Do NOT add a second row here; the previous implementation did that
          // and caused an offline-created transaction to appear twice after sync.
          replaceTransactionId(op.id,ref.id);
          syncQueue_.forEach(q=>{if(String(q.id)===String(op.id))q.id=ref.id;});
          removeQueuedOp_(syncQueue_.find(q=>q===op) || op);
        }else if(op.action==='set'){
          await txCol_().doc(String(op.id)).set({...op.payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
          removeQueuedOp_(op);
        }else if(op.action==='delete'){
          await txCol_().doc(String(op.id)).delete();
          removeQueuedOp_(op);
        }
      }catch(err){
        // Keep the operation for a later retry. A single transient failure should not block the UI.
        break;
      }
    }
    saveSyncQueue_();
    updateSyncStatusFromQueue_();
  }finally{syncQueueRunning_=false;}
}
function scheduleSyncRetry_(){
  clearTimeout(syncRetryTimer_);
  if(!firebaseUser || !navigator.onLine || !syncQueue_.length)return;
  syncRetryTimer_=setTimeout(()=>syncQueueNow_(),5000);
}
function startTransactionListener_(){
  if(txUnsubscribe_)txUnsubscribe_();
  if(!firebaseUser)return;
  try{
    txUnsubscribe_=txCol_().onSnapshot(snap=>{
      const rows=[]; snap.forEach(doc=>rows.push(normalizeFirebaseTx_(doc.id,doc.data())));
      allTransactions=applyPendingToRows_(rows); saveFirebaseCache_(); populateCategoryOptions(); applyFiltersAndRender();
      updateSyncStatusFromQueue_();
      syncQueueNow_();
    },()=>{ if(navigator.onLine)setSyncStatus_('online','متصل'); else setSyncStatus_('offline'); });
  }catch(e){}
}
function stopTransactionListener_(){if(txUnsubscribe_){txUnsubscribe_();txUnsubscribe_=null;}}
window.addEventListener('online',()=>{setSyncStatus_('syncing');syncQueueNow_();refreshData({silent:true});});
window.addEventListener('offline',()=>setSyncStatus_('offline'));

async function refreshData(options={}){
  if(!firebaseUser)return false;
  loadSyncQueue_();
  if(!navigator.onLine){setSyncStatus_('offline');renderCurrentSync_();return false;}
  if(syncInFlight)return false;
  syncInFlight=true;
  try{
    await refreshCategories_(true);
    const snap=await txCol_().get();
    const rows=[]; snap.forEach(doc=>rows.push(normalizeFirebaseTx_(doc.id,doc.data())));
    allTransactions=applyPendingToRows_(rows); saveFirebaseCache_(); populateCategoryOptions(); applyFiltersAndRender();
    if(!options.silent)showToast('تم تحديث البيانات من Firebase ✅');
    startTransactionListener_();
    await syncQueueNow_();
    return true;
  }catch(e){
    setSyncStatus_(navigator.onLine?'online':'offline',navigator.onLine?'متصل':'');
    if(!options.silent && !allTransactions.length)showToast('تعذر الاتصال بـ Firebase؛ سيتم إعادة المحاولة.');
    scheduleSyncRetry_(); return false;
  }finally{syncInFlight=false;}
}

async function submitAdd(){
  if(!firebaseUser){showToast('سجّل الدخول أولاً');return;}
  let category=document.getElementById('txCategory').value.trim();
  let statement=document.getElementById('txStatement').value.trim();
  const amount=parseFloat(document.getElementById('txAmount').value);
  const currency=document.getElementById('txCurrency').value;
  const date=document.getElementById('txDate').value;
  const isTransfer=selectedTxType==='تحويل';
  if(!date){showToast('اختر التاريخ');return;}
  if(isTransfer){category='تحويل عملة';statement='تحويل عملة';}
  if(!category){showToast('اختر الفئة');return;}
  if(!Number.isFinite(amount)||amount<=0){showToast('اكتب مبلغ صحيح');return;}
  const selectedCategory=findManagedCategoryByName_(category);
  const payload={date,category,categoryId:selectedCategory?selectedCategory.id:'',statement,type:selectedTxType,amount,currency,owner:firebaseUser.uid};
  if(isTransfer){
    payload.toCurrency=document.getElementById('txToCurrency').value;
    payload.toAmount=parseFloat(document.getElementById('txToAmount').value);
    if(!Number.isFinite(payload.toAmount)||payload.toAmount<=0){showToast('اكتب المبلغ المستلم بعد التحويل');return;}
    if(payload.toCurrency===currency){showToast('عملة المصدر والوجهة يجب أن تكونا مختلفتين');return;}
  }else{payload.toCurrency='';payload.toAmount=null;}
  const wasEditing=Boolean(editingTxId), editingId=editingTxId;
  const previous=wasEditing?allTransactions.find(t=>String(t.id)===String(editingId)):null;
  const tempId=wasEditing?editingId:makeTempId();
  const optimisticTx={id:tempId,...payload,createdAt:(wasEditing&&previous&&previous.createdAt)?previous.createdAt:Date.now()};
  upsertLocalTransaction(optimisticTx); closeModal('addModalOverlay');
  showToast(wasEditing?'تم التعديل فوراً ⚡ جارٍ الحفظ...':'تمت الإضافة فوراً ⚡ جارٍ الحفظ...');
  editingTxId=null; document.querySelector('#addModalOverlay h2').textContent='إضافة عملية';
  document.getElementById('txCategory').value=''; document.getElementById('txStatement').value=''; document.getElementById('txAmount').value=''; document.getElementById('txToAmount').value='';
  firebaseMutationCount++;
  try{
    if(!navigator.onLine){enqueueMutation_({action:wasEditing?'set':'add',id:tempId,payload,createdAt:optimisticTx.createdAt});setSyncStatus_('offline');showToast('تم الحفظ محلياً؛ سيتم الإرسال عند عودة الإنترنت.');return;}
    if(wasEditing){
      try{await txCol_().doc(String(editingId)).set({...payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});showToast('تم الحفظ في Firebase ✅');}
      catch(e){enqueueMutation_({action:'set',id:editingId,payload});scheduleSyncRetry_();setSyncStatus_('syncing');showToast('تم حفظ التعديل محلياً؛ سيُزامن تلقائياً.');}
    }else{
      try{const ref=await txCol_().add({...payload,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});replaceTransactionId(tempId,ref.id);showToast('تم الحفظ في Firebase ✅');}
      catch(e){enqueueMutation_({action:'add',id:tempId,payload,createdAt:optimisticTx.createdAt});scheduleSyncRetry_();setSyncStatus_('syncing');showToast('تمت الإضافة محلياً؛ سيُزامن تلقائياً.');}
    }
  }finally{firebaseMutationCount=Math.max(0,firebaseMutationCount-1);}
}

async function deleteTx(id){
  if(!firebaseUser)return;
  if(!confirm('حذف هذه العملية؟'))return;
  const previous=allTransactions.find(t=>String(t.id)===String(id)); if(!previous)return;
  removeLocalTransaction(id); showToast('تم الحذف فوراً ⚡ جارٍ الحفظ...'); firebaseMutationCount++;
  try{
    if(!navigator.onLine){enqueueMutation_({action:'delete',id});setSyncStatus_('offline');showToast('تم الحذف محلياً؛ سيُزامن عند عودة الإنترنت.');return;}
    try{await txCol_().doc(String(id)).delete();showToast('تم الحذف من Firebase ✅');}
    catch(e){enqueueMutation_({action:'delete',id});scheduleSyncRetry_();setSyncStatus_('syncing');showToast('تم الحذف محلياً؛ سيُزامن تلقائياً.');}
  }finally{firebaseMutationCount=Math.max(0,firebaseMutationCount-1);}
}

async function refreshCategories_(silent=true){
  if(!firebaseUser)return false;
  try{
    const snap=await catCol_().get();
    managedCategories=[]; snap.forEach(doc=>{const d=doc.data();if(d.active!==false)managedCategories.push({id:doc.id,name:d.name||'',aliases:Array.isArray(d.aliases)?d.aliases:[]});});
    managedCategories.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
    try{localStorage.setItem(firebaseCatCacheKey_(),JSON.stringify(managedCategories));}catch(e){}
    populateCategoryOptions(); renderCategoryManager(); return true;
  }catch(e){
    try{managedCategories=JSON.parse(localStorage.getItem(firebaseCatCacheKey_())||'[]');}catch(x){managedCategories=[];}
    populateCategoryOptions(); renderCategoryManager();
    if(!silent)showToast('تعذر تحميل الفئات'); return false;
  }
}
async function addCategory(){
  const input=document.getElementById('newCategoryName'); if(!input)return;
  const name=input.value.trim(); if(!name){showToast('اكتب اسم الفئة');return;}
  if(managedCategories.some(c=>c.name===name)){showToast('الفئة موجودة مسبقاً');return;}
  try{await catCol_().add({name,aliases:[],active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});input.value='';await refreshCategories_(true);showToast('تمت إضافة الفئة ✅');}
  catch(e){console.error('Firebase addCategory error',e);showToast(e && e.message ? 'فشل إضافة الفئة: '+e.message : 'فشل إضافة الفئة');}
}

async function editCategory(id){
  const c=managedCategories.find(x=>String(x.id)===String(id));if(!c)return;
  const name=prompt('اسم الفئة الجديد:',c.name); if(name===null)return; const trimmed=name.trim();
  if(!trimmed||trimmed===c.name)return;
  try{await catCol_().doc(String(id)).set({name:trimmed,active:true,aliases:firebase.firestore.FieldValue.arrayUnion(c.name),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await refreshCategories_(true);showToast('تم تعديل الفئة ✅');}
  catch(e){showToast('فشل تعديل الفئة');}
}
async function deleteCategoryUi(id){
  const c=managedCategories.find(x=>String(x.id)===String(id));if(!c)return;
  if(!confirm('إخفاء الفئة «'+c.name+'»؟ العمليات القديمة لن تُحذف.'))return;
  try{await catCol_().doc(String(id)).set({active:false,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await refreshCategories_(true);showToast('تم إخفاء الفئة ✅');}
  catch(e){showToast('فشل حذف الفئة');}
}

/* Firebase budget data layer */
async function refreshBudgets_(month=currentMonthPrefixSafe_(), silent=true){
  if(!firebaseUser)return false;
  try{
    const snap=await budgetCol_().where('month','==',month).get();
    budgetData=[];
    snap.forEach(doc=>{const d=doc.data()||{};budgetData.push({id:doc.id,month:d.month||month,category:d.category||'',amount:Number(d.amount)||0,currency:d.currency||'USD'});});
    budgetMonth=month;
    renderBudgetSection();
    if(document.getElementById('budgetModalOverlay') && !document.getElementById('budgetModalOverlay').classList.contains('hidden')) renderBudgetManagerRows();
    return true;
  }catch(e){
    if(!silent)showToast('تعذر تحميل الميزانية');
    return false;
  }
}
async function saveAllBudgets(){
  if(!firebaseUser){showToast('سجّل الدخول أولاً');return;}
  const month=document.getElementById('budgetMonth').value||currentMonthPrefixSafe_();
  const ops=[];
  const totalAmount=parseFloat(document.getElementById('totalBudgetAmount').value);
  const totalCurrency=document.getElementById('totalBudgetCurrency').value;
  const oldTotal=budgetData.find(b=>!b.category);
  if(Number.isFinite(totalAmount)&&totalAmount>=0) ops.push({old:oldTotal,month,category:'',amount:totalAmount,currency:totalCurrency});
  else if(oldTotal) ops.push({old:oldTotal,delete:true});
  document.querySelectorAll('.budget-cat-input').forEach((input,index)=>{
    const amount=parseFloat(input.value); const cat=input.dataset.category;
    const currency=document.querySelectorAll('.budget-cat-currency')[index].value;
    const old=budgetData.find(b=>b.category===cat);
    if(Number.isFinite(amount)&&amount>=0) ops.push({old,month,category:cat,amount,currency});
    else if(old) ops.push({old,delete:true});
  });
  if(!ops.length){closeModal('budgetModalOverlay');return;}
  try{
    const batch=firebaseDb.batch();
    ops.forEach(op=>{
      const ref=op.old ? budgetCol_().doc(String(op.old.id)) : budgetCol_().doc();
      if(op.delete) batch.delete(ref);
      else batch.set(ref,{month:op.month,category:op.category||'',amount:Number(op.amount)||0,currency:op.currency||'USD',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    });
    await batch.commit();
    await refreshBudgets_(month,true);
    closeModal('budgetModalOverlay');
    showToast('تم حفظ الميزانية ✅');
  }catch(e){
    console.error(e);
    showToast('فشل حفظ الميزانية');
  }
}

const DEFAULT_CATEGORIES_ = ['راتب','عمل حر','طعام','مواصلات','فواتير','تسوق','صحة','ترفيه','منزل','أخرى'];
function populateCategoryOptions(){
  const txCats=allTransactions.map(t=>t.category).filter(Boolean);
  const managed=(managedCategories||[]).map(c=>c.name).filter(Boolean);
  const cats=Array.from(new Set([...managed,...txCats])).sort((a,b)=>String(a).localeCompare(String(b),'ar'));
  const sel=document.getElementById('txCategory');
  if(sel){
    const currentVal=sel.value;
    sel.innerHTML='<option value="">اختر الفئة</option>'+cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    if(currentVal && cats.includes(currentVal)) sel.value=currentVal;
  }
  const dl=document.getElementById('categoryList');
  if(dl) dl.innerHTML=cats.map(c=>`<option value="${escapeHtml(c)}">`).join('');
  const filter=document.getElementById('filterCategory');
  if(filter){
    const currentFilter=filter.value;
    filter.innerHTML='<option value="">الكل</option>'+cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    filter.value=currentFilter;
  }
}

  const div=document.createElement('div');
  div.id='firebaseSettingsOverlay';
  div.className='modal-overlay hidden';
  div.innerHTML=`
    <div class="modal-card">
      <div class="modal-head"><h2>⚙️ الإعدادات</h2><button class="icon-btn" onclick="closeModal('firebaseSettingsOverlay')">✕</button></div>
      <div class="field">
        <label>سعر صرف الليرة السورية مقابل الدولار</label>
        <input id="settingsRateSyp" type="number" step="any" inputmode="decimal" placeholder="مثال: 13000">
      </div>
      <div class="field">
        <label>سعر صرف الليرة التركية مقابل الدولار</label>
        <input id="settingsRateTry" type="number" step="any" inputmode="decimal" placeholder="مثال: 34">
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;">
        <strong style="font-size:14px;">الفئات</strong>
        <button class="mini-btn" onclick="openCategoryManager()">إدارة الفئات</button>
      </div>
      <div style="color:var(--muted);font-size:12px;line-height:1.7;margin-bottom:10px;">أضف أو عدّل الفئات من هنا. الفئة تستخدم للتقارير والميزانيات، والبيان يبقى لتفاصيل العملية.</div>
      <div class="modal-actions">
        <button class="secondary-btn" onclick="closeModal('firebaseSettingsOverlay')">إلغاء</button>
        <button class="primary-btn" onclick="saveFirebaseSettings_()">حفظ الإعدادات</button>
      </div>
    </div>`;
  document.body.appendChild(div);
}
async function loadFirebaseSettings_(){
  if(!firebaseUser)return;
  try{
    const snap=await userRef_().collection('settings').doc('preferences').get();
    const d=snap.exists?snap.data():{};
    rateSyp=Number(d.rateSyp)||Number(localStorage.getItem(RATE_SYP_KEY))||0;
    rateTry=Number(d.rateTry)||Number(localStorage.getItem(RATE_TRY_KEY))||0;
    localStorage.setItem(RATE_SYP_KEY,String(rateSyp||0));
    localStorage.setItem(RATE_TRY_KEY,String(rateTry||0));
  }catch(e){}
}
async function saveFirebaseSettings_(){
  if(!firebaseUser)return;
  const syp=parseFloat(document.getElementById('settingsRateSyp').value)||0;
  const tr=parseFloat(document.getElementById('settingsRateTry').value)||0;
  rateSyp=syp; rateTry=tr;
  localStorage.setItem(RATE_SYP_KEY,String(syp)); localStorage.setItem(RATE_TRY_KEY,String(tr));
  try{
    await userRef_().collection('settings').doc('preferences').set({rateSyp:syp,rateTry:tr,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    applyFiltersAndRender();
    closeModal('firebaseSettingsOverlay'); showToast('تم حفظ الإعدادات ✅');
  }catch(e){showToast('تعذر حفظ الإعدادات');}
}
function openSettings(){
  if(!firebaseUser)return;
  ensureSettingsModal_();
  document.getElementById('settingsRateSyp').value=rateSyp||'';
  document.getElementById('settingsRateTry').value=rateTry||'';
  showModal_('firebaseSettingsOverlay');
}


async function ensureDefaultCategories_(){
  if(!firebaseUser)return;
  try{
    const snap=await catCol_().limit(1).get();
    if(!snap.empty)return;
    const batch=firebaseDb.batch();
    DEFAULT_CATEGORIES_.forEach(name=>{
      batch.set(catCol_().doc(),{name,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    await batch.commit();
  }catch(e){}
}

firebaseAuth.onAuthStateChanged(async user=>{
  firebaseUser=user; firebaseAuthReady=true;
  if(!user){
    stopTransactionListener_(); clearTimeout(syncRetryTimer_); syncQueue_=[];
    allTransactions=[]; managedCategories=[];
    showFirebaseLogin_();
    return;
  }
  showFirebaseApp_();
  loadSyncQueue_();
  // Load cached categories immediately so the Add Transaction form works offline.
  // Firebase is refreshed afterward when connectivity is available.
  loadFirebaseCategoryCache_();
  setSyncStatus_(navigator.onLine ? 'online' : 'offline');
  if(navigator.onLine) await ensureDefaultCategories_();
  await loadFirebaseSettings_();
  await refreshBudgets_(currentMonthPrefixSafe_(), true);
  const hadCache=loadFirebaseCache_();
  if(!navigator.onLine){
    populateCategoryOptions();
    applyFiltersAndRender();
    return;
  }
  await refreshData({silent:hadCache});
});
