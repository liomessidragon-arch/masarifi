<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green Energy – النماذج</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#1d2a1f;--line:#9db0a0;--green:#7cb82f;--blue:#a9c8e8;--muted:#5d6e60;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a15;--card:#1d261f;--ink:#e8efe8;--line:#4b5d4e;--blue:#2f4a63;--muted:#9bb09e}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,Arial,sans-serif;font-size:15px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--green);display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
.bar b{color:var(--green);margin-inline-end:auto}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer}
button.p{background:var(--green);border-color:var(--green);color:#10200a;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.tabs{display:flex;gap:6px;padding:8px 12px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding:10px}
.sheet{background:var(--card);border:1px solid var(--line);padding:14px}
.hdr{position:relative;background:#fff;container-type:inline-size;margin-bottom:6px}
.hdr img{display:block;width:100%;height:auto}
.hdr input{position:absolute;background:transparent;border:0;border-bottom:1px dashed #888;font:700 1.7cqw/1 Arial,Tahoma,sans-serif;color:#000;text-align:center;padding:0;direction:ltr}
.plain{background:none;color:var(--ink);font-size:20px;margin:6px 0 10px}
h2{margin:8px 0;text-align:center;background:var(--green);color:#10200a;font-size:17px;padding:4px}
.sec{background:var(--blue);text-align:center;font-weight:700;padding:3px;border:1px solid var(--line);margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-top:0}
.f{display:flex;flex-direction:column;gap:2px;padding:6px 8px;border:1px solid var(--line);margin:-.5px}
.f.w{grid-column:1/-1}
.f label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=date],textarea,select{font:inherit;font-size:16px;font-weight:600;width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);padding:4px 2px}
textarea{resize:vertical;min-height:50px}
.opts{display:flex;flex-wrap:wrap;gap:4px 16px}
.opts label{display:flex;gap:5px;align-items:center;font-weight:500;color:var(--ink);font-size:14px}
.opts input{width:17px;height:17px;accent-color:var(--green)}
.note{font-size:12px;line-height:1.7;border:1px solid var(--line);padding:6px 10px;margin-top:8px}
.list{margin-top:14px}
.rec{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:6px}
.rec span{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:14px}
.pv{display:none}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
@media print{
 @page{size:A4;margin:6mm}
 body{background:#fff;color:#000;font-size:11px}
 .bar,.tabs,.list,.noprint{display:none!important}
 .gridwrap{overflow:visible}
 .g24{min-width:0;font-size:9.5px}
 .g24>div{min-height:5.6mm;padding:0 4px}
 .g24 .S{min-height:5mm;margin-top:2mm}
 .g24 textarea{height:11mm}
 .g24 .ins{font-size:8.6px;line-height:1.5}
 .g24 .sig{line-height:1.9;min-height:18mm}
 .att{font-size:8.5px;margin-top:1mm}
 .hdr{margin-bottom:1mm}
 .fx{font-size:12px}
 .fx .row{margin:5px 0}
 .fx .lines{height:72mm;line-height:8mm;background-size:4px 8mm}
 .fx .box{height:58mm}
 .fx .box.sm{height:20mm}
 .ftr{position:fixed;left:7mm;right:7mm;bottom:3mm;margin:0}

 h2{margin:1mm 0 2mm;font-size:13px;padding:1px}
 .hdr input{border-bottom:0}
 .wrap{max-width:none;padding:0}
 .sheet{border:0;padding:0}
 :root{--card:#fff;--ink:#000;--line:#555;--muted:#000;--blue:#a9c8e8}
 .grid{grid-template-columns:1fr 1fr}
 input[type=text],input[type=date],textarea,select{border:0}
 select{appearance:none}
 h2,.sec{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.gridwrap{overflow-x:auto}
.g24{display:grid;grid-template-columns:repeat(24,1fr);min-width:720px;direction:rtl;font-size:12px}
.g24>div{border:1px solid #333;margin:0 -1px -1px 0;padding:2px 5px;min-height:26px;display:flex;align-items:center;color:#000;background:#fff}
.g24 .L{background:#c9d5e8;font-weight:700}
.g24 .Ls{font-size:9px;line-height:1.2}
.g24 .S{background:#a9c0e0;font-weight:700;justify-content:center;min-height:22px;margin-top:6px}
.g24 input[type=text]{border:0;border-bottom:0;background:transparent;color:#000;width:100%;font:inherit;font-size:13.5px;font-weight:700;padding:0}
.g24 .C{justify-content:space-between;gap:6px;font-weight:700}
.g24 input.sq{appearance:none;-webkit-appearance:none;width:20px;height:12px;border:1.5px solid #444;border-radius:3px;margin:0;flex:none;background:#fff}
.g24 input.sq:checked{background:#7cb82f}
.g24 .B{display:block}
.g24 .ins{font-size:11px;line-height:1.75;font-weight:700}
.g24 .sig{display:flex;justify-content:space-between;gap:10px;width:100%;font-weight:700;line-height:2.1}
.g24 .sig input{display:inline-block;width:150px;border-bottom:1px dotted #666}
.g24 .op{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-weight:700}
.g24 .op label{display:flex;align-items:center;gap:6px}
.g24 textarea{width:100%;height:60px;border:0;background:transparent;color:#000;font:inherit;font-size:13.5px;font-weight:700;resize:none}
.att{font-size:10px;font-weight:700;line-height:1.6;margin-top:4px;color:var(--ink)}


.ftr{display:block;width:100%;margin-top:8px;background:#fff}
.fx{color:var(--ink);font-size:14px;font-weight:700;background:var(--card)}
.fx .row{display:flex;align-items:baseline;gap:6px;margin:11px 0;white-space:nowrap}
.fx .row input{flex:1;min-width:0;border:0;border-bottom:1.5px dotted #333;background:transparent;color:inherit;font:inherit;font-size:15px;font-weight:700;padding:0 4px}
.fx .row span{flex:none}
.fx .lines{display:block;width:100%;border:0;background:transparent;color:inherit;font:inherit;font-size:15px;font-weight:700;line-height:9mm;height:81mm;padding:0 4px;resize:none;
 background-image:radial-gradient(circle at 2px calc(100% - 2px),#333 .75px,transparent 1.1px);background-size:4px 9mm}
.fx .inl{display:inline-block;line-height:1.3;height:1.4em;vertical-align:baseline;width:80px;min-width:0;border:0;border-bottom:1.5px dotted #333;background:transparent;color:inherit;font:inherit;font-size:15px;font-weight:700;text-align:center;padding:0}
.fx .para{line-height:3.1;margin:10px 0}
.fx .box{border:1px solid #333;padding:4px 8px;height:62mm;margin-top:10px}
.fx .box textarea{width:100%;height:calc(100% - 22px);border:0;background:transparent;color:inherit;font:inherit;font-size:14px;font-weight:600;resize:none}
.fx .sg{display:flex;justify-content:flex-end;margin:6px 0 4px;padding-left:22mm}


table.rpt{border-collapse:collapse;width:100%;min-width:760px;font-size:11px}
table.rpt th,table.rpt td{border:1px solid #333;padding:2px 4px;text-align:center;color:#000}
table.rpt th{background:#c9d5e8;font-weight:700}
table.rpt td.tn{width:26px;font-weight:700;background:#eef2f7}
table.rpt input{border:0;background:transparent;width:100%;text-align:center;font:inherit;font-size:12px;font-weight:600;color:#000}
table.rpt tfoot td{background:#eef2f7}
@media print{
 table.rpt{font-size:7.5px;min-width:0}
 table.rpt input{font-size:8px}
 table.rpt td{padding:0 3px;height:3.6mm}
}

</style>
</head>

function gridHtml(rows) {
 const cell = c => {
  const st = `grid-column:span ${c.n}`;
  if (c.t === 'L') return `<div class="L ${c.sm ? 'Ls' : ''}" style="${st}">${c.l}</div>`;
  if (c.t === 'V') return `<div style="${st}"><input type="text" data-k="${c.id}"></div>`;
  if (c.t === 'C') return `<div class="C" style="${st}"><span>${c.v}</span><input class="sq" type="radio" name="${c.id}" data-k="${c.id}" value="${c.v}"></div>`;
  if (c.t === 'E') return `<div style="${st}"></div>`;
  if (c.t === 'S') return `<div class="S" style="${st}">${c.l}</div>`;
  return `<div class="B" style="${st};${c.h ? 'min-height:' + c.h : ''}">${c.html}</div>`;
 };
 return `<div class="gridwrap"><div class="g24">${rows.map(cell).join('')}</div></div>`;
}

let cur = 'f1', curId = null;
const $ = s => document.querySelector(s);
const key = f => 'ge_recs_' + f;
const load = f => { try { return JSON.parse(localStorage.getItem(key(f)) || '[]'); } catch (e) { return []; } };
const store = (f, a) => { try { localStorage.setItem(key(f), JSON.stringify(a)); } catch (e) { alert('تعذر الحفظ على هذا الجهاز'); } };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderTabs() {
 $('#tabs').innerHTML = Object.entries(FORMS).map(([k, f]) =>
  `<button class="${k === cur ? 'on' : ''}" onclick="cur='${k}';curId=null;render()">${f.name}</button>`).join('');
}

function render(data = {}) {
 renderTabs();
 const F = FORMS[cur];
 const H = HDR[cur];
 let h = `<div class="hdr"><img alt="Green Energy" src="${H.img}">
  <input type="text" data-k="date" aria-label="التاريخ" style="left:${H.date[0]}%;top:${H.date[1]}%;width:${H.date[2]}%;height:${H.date[3]}%">
  <input type="text" data-k="reqNo" aria-label="الرقم" style="left:${H.num[0]}%;top:${H.num[1]}%;width:${H.num[2]}%;height:${H.num[3]}%">
  ${H.branch ? `<input type="text" data-k="branch" aria-label="الفرع" style="left:${H.branch[0]}%;top:${H.branch[1]}%;width:${H.branch[2]}%;height:${H.branch[3]}%">` : ''}
  ${H.dept ? `<input type="text" data-k="dept" aria-label="القسم" style="left:${H.dept[0]}%;top:${H.dept[1]}%;width:${H.dept[2]}%;height:${H.dept[3]}%">` : ''}</div>
  <h2 class="${F.plain ? 'plain' : ''}">${F.title}</h2>`;
 if (typeof F.html === 'function') { h += F.html(); }
 else if (F.html) { h += F.html; }
 else if (F.rows) { h += gridHtml(F.rows) + (F.after || ''); }
 else {
 let open = false;
 const close = () => { if (open) { h += '</div>'; open = false; } };
 F.fields.forEach(x => {
  if (x.sec) { close(); h += `<div class="sec">${x.sec}</div><div class="grid">`; open = true; return; }
  if (x.note) { h += `<div class="f w"><div class="note" style="border:0;margin:0">${x.note}</div></div>`; return; }
  let inner;
  if (x.radio) inner = `<div class="opts">${x.radio.map(o => `<label><input type="radio" name="${x.id}" data-k="${x.id}" value="${o}">${o}</label>`).join('')}</div>`;
  else if (x.area) inner = `<textarea data-k="${x.id}" rows="${x.rows || 3}"></textarea>`;
  else if (x.date) inner = `<input type="date" data-k="${x.id}">`;
  else inner = `<input type="text" data-k="${x.id}">`;
  h += `<div class="f ${x.w ? 'w' : ''}"><label>${x.l}</label>${inner}</div>`;
 });
 close(); }
 $('#sheet').innerHTML = h;
 fill(data);
 list();
}

function fill(d) {
 document.querySelectorAll('[data-k]').forEach(el => {
  const v = d[el.dataset.k];
  if (el.type === 'radio') el.checked = (v === el.value);
  else el.value = v ?? '';
 });
 if (!d.date) { const el = document.querySelector('[data-k=date]'); const t = new Date(); if (el) el.value = t.getDate() + ' / ' + (t.getMonth() + 1) + ' / ' + t.getFullYear(); }
}

function collect() {
 const d = {};
 document.querySelectorAll('[data-k]').forEach(el => {
  if (el.type === 'radio') { if (el.checked) d[el.dataset.k] = el.value; }
  else d[el.dataset.k] = el.value;
 });
 return d;
}

function saveRec() {
 const d = collect(), a = load(cur);
 if (!d.name && !d.phone) { alert('اكتب اسم مقدم الطلب أو رقم التواصل أولاً'); return; }
 if (curId) { const i = a.findIndex(r => r.id === curId); if (i > -1) a[i] = { id: curId, d }; else a.unshift({ id: curId, d }); }
 else { curId = 'r' + Date.now(); a.unshift({ id: curId, d }); }
 store(cur, a); list();
}

function newRec() { curId = null; render(); window.scrollTo(0, 0); }
function openRec(id) { const r = load(cur).find(r => r.id === id); if (r) { curId = id; render(r.d); window.scrollTo(0, 0); } }
function delRec(id) { if (!confirm('حذف هذا الطلب؟')) return; store(cur, load(cur).filter(r => r.id !== id)); if (curId === id) curId = null; list(); }

function list() {
 const a = load(cur);
 $('#recs').innerHTML = a.length ? a.map(r => `<div class="rec"><div>${esc(r.d.name || '—')}<br><span>${esc(r.d.phone || '')} ${esc(r.d.date || '')}</span></div>
  <div><button onclick="openRec('${r.id}')">فتح</button> <button onclick="delRec('${r.id}')">حذف</button></div></div>`).join('')
  : '<div class="empty">ما في طلبات محفوظة بعد. عبّي النموذج واضغط «حفظ».</div>';
}
render();
</script>
</body>
